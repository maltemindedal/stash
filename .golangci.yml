version: "2"

run:
  timeout: 2m

linters:
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errorlint
    - makezero
    - nilnesserr
    - predeclared
    - wastedassign
  settings:
    depguard:
      rules:
        stdlib-only:
          # Stash is built from the standard library alone: an import outside it
          # and this module fails lint, in code and tests (PR #36 rejected
          # golang.org/x/sys). A `require` block in go.mod is still a review check.
          list-mode: strict
          files:
            - $all
          allow:
            - $gostd
            # The trailing slash keeps a lookalike such as .../stash-evil out.
            - github.com/maltemindedal/stash/
    govet:
      enable-all: true
      disable:
        # Struct layout and shadowing findings are style, not defects, and would
        # need churn across the tree to satisfy.
        - fieldalignment
        - shadow
    staticcheck:
      checks: ["all"]
