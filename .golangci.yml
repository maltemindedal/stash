version: "2"

run:
  timeout: 2m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errorlint
    - makezero
    - nilnesserr
    - predeclared
    - wastedassign
  settings:
    govet:
      enable-all: true
      disable:
        # Struct layout and shadowing findings are style, not defects, and would
        # need churn across the tree to satisfy.
        - fieldalignment
        - shadow
    staticcheck:
      checks: ["all"]
